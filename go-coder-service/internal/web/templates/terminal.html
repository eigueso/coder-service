<!doctype html>
<html lang="en">
<head>
  {{template "head" .}}
  <link rel="stylesheet" href="/static/css/xterm.css" />
  <script src="/static/js/xterm.js" defer></script>
  <script src="/static/js/addon-fit.js" defer></script>
  <script src="/static/js/terminal.js" defer></script>
  <title>{{.WorkspaceName}} · Terminal · Coder Service</title>
</head>
<body>
<div class="flex min-h-screen flex-col bg-ink text-white"
     id="terminal-root" data-workspace="{{.WorkspaceName}}" data-agent-id="{{.AgentID}}">
  <header class="flex items-center justify-between border-b border-white/10 px-4 py-3">
    <div>
      <p class="font-mono text-[10px] tracking-[0.2em] text-teal-300 uppercase">coder-service terminal</p>
      <h1 class="text-sm font-medium">{{.WorkspaceName}}</h1>
    </div>
    <div class="flex items-center gap-3">
      <span id="terminal-status" class="font-mono text-[11px] text-white/50">connecting…</span>
      <a href="/workspaces" class="rounded-lg border border-white/15 px-3 py-1.5 text-xs text-white/80 transition hover:border-white/40 hover:text-white">Back</a>
    </div>
  </header>
  <p id="terminal-error" class="hidden border-b border-red-500/30 bg-red-950/50 px-4 py-2 font-mono text-xs text-red-200"></p>
  <div id="terminal-container" class="min-h-0 flex-1 p-2"></div>
</div>
</body>
</html>
